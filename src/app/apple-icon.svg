<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <rect width="180" height="180" rx="40" fill="#090E1A" />
  <rect x="1" y="1" width="178" height="178" rx="39" stroke="#1E293B" stroke-width="2" />
  <defs>
    <linearGradient id="appleGrad" x1="20" y1="20" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="appleSpark" x1="60" y1="50" x2="120" y2="110" gradientUnits="userSpaceOnUse">
